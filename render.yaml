services:
  - type: web
    name: amori-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install; npm run build;
    startCommand: node dist/main.js;
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /

